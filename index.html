<!DOCTYPE html>
<html>
<head>
    <title>ACCESSO NEGATO</title>
    <style>
        body { background-color: #111; color: #00ff00; font-family: monospace; padding: 50px; text-align: center; }
        input { background: #222; color: #00ff00; border: 1px solid #00ff00; padding: 10px; font-family: monospace; font-size: 16px; }
        button { background: #00ff00; color: #111; border: none; padding: 10px 20px; cursor: pointer; font-family: monospace; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h1>SISTEMA CRIPTATO</h1>
    <p>Inserire la chiave di decodifica trovata nel romanzo per accedere ai file riservati:</p>
    
    <!-- Casella di testo per la password -->
    <input type="password" id="pass" placeholder="PASSWORD">
    <button onclick="verifica()">ACCEDI</button>

    <script>
        function verifica() {
            var password = document.getElementById("pass").value;
            
            // IMPORTANTE: Cambia "lamia-password" con la vera parola che i lettori devono trovare!
            if (password === ".--- ..- -. .. --- .-. / --- ... .- -.- .-") {
                alert("Accesso consentito. Reindirizzamento in corso...");
                
                // IMPORTANTE: Cambia questo link con la pagina del premio finale (es. un capitolo bonus)
                window.location.href = "premio.html"; 
            } else {
                alert("Chiave errata. Accesso negato.");
            }
        }
    </script>
</body>
</html>
